[project]
name = "implicit-word-network"
version = "0.1.0"
description = "Extract and explore (contextual) implicit entity networks from text corpora."
authors = [
    {name = "Julian Schelb", email = "julian.schelb@uni-konstanz.de"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["implicit entity networks", "cooccurrence networks", "named entity recognition", "corpus exploration", "gliner", "spacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Python 3.14 support depends on PyTorch/spaCy releasing compatible wheels.
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy (>=1.24.0,<3.0.0)",
    "scipy (>=1.10.0,<2.0.0)",
    "networkx (>=3.0,<4.0)",
    "tqdm (>=4.64.0,<5.0.0)",
]

[project.optional-dependencies]
spacy = [
    "spacy (>=3.5.0,<4.0.0)",
]
gliner = [
    # GLiNER v2.5 checkpoints (gliner-community/gliner_*-v2.5) need gliner>=0.2.20.
    "gliner (>=0.2.20,<0.3.0)",
    "torch (>=2.0.0,<3.0.0)",
]
embeddings = [
    "sentence-transformers (>=3.0.0,<6.0.0)",
]
viz = [
    "matplotlib (>=3.7.0,<4.0.0)",
]
pandas = [
    "pandas (>=2.0.0,<3.0.0)",
]
all = [
    "spacy (>=3.5.0,<4.0.0)",
    "gliner (>=0.2.20,<0.3.0)",
    "torch (>=2.0.0,<3.0.0)",
    "sentence-transformers (>=3.0.0,<6.0.0)",
    "matplotlib (>=3.7.0,<4.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
]
test = [
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-cov (>=4.0.0)",
    "hypothesis (>=6.100.0)",
]
docs = [
    "mkdocs (>=1.5.0)",
    "mkdocs-material (>=9.0.0)",
    "mkdocstrings[python] (>=0.24.0)",
]
dev = [
    "pytest (>=8.0.0,<10.0.0)",
    "pytest-cov (>=4.0.0)",
    "hypothesis (>=6.100.0)",
    "mkdocs (>=1.5.0)",
    "mkdocs-material (>=9.0.0)",
    "mkdocstrings[python] (>=0.24.0)",
    "poethepoet (>=0.24.0)",
    "ruff (>=0.8.0)",
    "mypy (>=1.10.0)",
    "scipy-stubs (>=1.14.0) ; python_version >= '3.11'",
    "types-tqdm (>=4.66.0)",
    "pre-commit (>=3.5.0)",
    "build (>=1.0.0)",
    "python-semantic-release (>=9.0.0)",
]

[project.urls]
Homepage = "https://github.com/julianschelb/implicit-word-network"
Documentation = "https://julianschelb.github.io/implicit-word-network/"
Repository = "https://github.com/julianschelb/implicit-word-network"
Issues = "https://github.com/julianschelb/implicit-word-network/issues"
Changelog = "https://github.com/julianschelb/implicit-word-network/blob/main/CHANGELOG.md"

[project.scripts]
implicit-word-network = "implicit_word_network.cli:main"

[tool.poetry]
packages = [
    {include = "implicit_word_network", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -m 'not integration'"
markers = [
    "integration: tests that download and run real models (deselected by default; run with -m integration)",
    "spacy: tests that need spaCy and the en_core_web_sm model",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch",
    "ignore::FutureWarning:torch",
]

[tool.coverage.run]
source = ["implicit_word_network"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov=implicit_word_network --cov-report=term-missing"
test-integration = "pytest -m integration"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/implicit_word_network/"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
docs-deploy = "mkdocs gh-deploy --force"
check = ["lint", "format-check", "typecheck", "test"]

# ---------- Ruff ----------

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "SIM108", # ternary operator (readability)
    "B905",   # zip strict (py310 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["implicit_word_network"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]              # relax bugbear & simplify in tests
"src/**/__init__.py" = ["F401"]       # re-exports look like unused imports

# ---------- Mypy ----------

[tool.mypy]
# Matches CI's typecheck job (which runs on 3.12), not the package's minimum
# supported Python (3.10): newer numpy releases ship inline .pyi stubs using
# PEP 695 `type` statements, which mypy refuses to parse when python_version
# is set below 3.12, regardless of the interpreter mypy itself runs under.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true        # third-party stubs not always available
exclude = ["tests/", "examples/"]

# ---------- Semantic Release ----------

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/implicit_word_network/__init__.py:__version__"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false  # breaking changes bump the minor version while < 1.0

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"  # prepend new sections at the insertion flag, keep hand-written history
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = [
    "chore\\(release\\):",
]

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
