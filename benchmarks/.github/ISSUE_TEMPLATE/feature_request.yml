name: Feature request
description: Suggest an extractor, export, query or API improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch, references to the literature, or examples from other tools.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
