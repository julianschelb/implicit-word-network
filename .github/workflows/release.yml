name: Release

# Automated releases in the style of LociSimiles:
#   1. CI passes on main
#   2. python-semantic-release inspects the Conventional Commits since the last
#      tag, bumps pyproject.toml / __init__.py, updates CHANGELOG.md, commits,
#      tags (vX.Y.Z) and creates the GitHub release
#   3. the distribution is published to PyPI via Trusted Publishing (OIDC)
#
# No API tokens are needed: the workflow uses the built-in GITHUB_TOKEN and
# PyPI's OIDC trust for the `pypi` environment. It can also be started by hand
# (workflow_dispatch) to release without waiting for CI.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_current:
        description: "Publish the checked-out version as-is (no bump); needs a matching vX.Y.Z tag"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    concurrency: release
    outputs:
      released: ${{ steps.flag.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run semantic-release
        id: semrel
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_current) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          semantic-release version
          if ls dist/*.whl dist/*.tar.gz 2>/dev/null | grep -q .; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the current version (manual publish, no bump)
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_current }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION does not exist; tag the release first" >&2
            exit 1
          fi
          pip install build
          python -m build
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release flag
        id: flag
        run: echo "released=${{ steps.semrel.outputs.released || steps.manual.outputs.released || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Check distribution
        if: steps.flag.outputs.released == 'true'
        run: |
          pip install twine
          twine check dist/*

      - name: Publish GitHub release assets
        if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish

      - name: Upload dist artifacts
        if: steps.flag.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/implicit-word-network
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
